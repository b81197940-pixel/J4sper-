<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanlines"></div>
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-mark"></div>
          <div class="brand-text">
            <div class="brand-title">JARVIS</div>
            <div class="brand-subtitle">STARK OS</div>
          </div>
        </div>

        <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Collapse sidebar">⟨</button>
      </div>

      <div class="nav">
        <button class="nav-item active" data-panel="home" type="button">
          <span class="nav-icon">⌂</span>
          <span class="nav-label">Home</span>
        </button>

        <button class="nav-item" data-panel="shortcuts" type="button">
          <span class="nav-icon">↗</span>
          <span class="nav-label">Shortcuts</span>
        </button>

        <button class="nav-item" data-panel="tube" type="button">
          <span class="nav-icon">▶</span>
          <span class="nav-label">Saved Videos</span>
        </button>

        <button class="nav-item" data-panel="calendar" type="button">
          <span class="nav-icon">🗓</span>
          <span class="nav-label">Calendar</span>
        </button>
      </div>

      <div class="sidebar-bottom">
        <div class="mode-badge" id="modeBadge">
          <span id="modeIcon">☀</span>
          <span id="modeText">Day Mode</span>
        </div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div class="datetime">
          <span id="date">Loading date...</span>
          <span class="dot"></span>
          <span id="time">Loading time...</span>
        </div>
      </header>

      <section class="panel active" id="home-panel">
        <div class="panel-title">Home</div>
        <div class="hero-card">
          <h1>JARVIS HUB</h1>
          <p>Personal command interface</p>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="stat-label">Videos</div>
            <div class="stat-value" id="videoCount">0</div>
          </div>
          <div class="stat">
            <div class="stat-label">Events</div>
            <div class="stat-value" id="eventCount">0</div>
          </div>
        </div>
      </section>

      <section class="panel" id="shortcuts-panel">
        <div class="panel-title">Shortcuts</div>
        <div class="button-row">
          <a class="neo-btn" href="https://www.youtube.com" target="_blank" rel="noopener">YouTube</a>
          <a class="neo-btn" href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a>
          <a class="neo-btn" href="#calendar-panel">Calendar</a>
        </div>
      </section>

      <section class="panel" id="tube-panel">
        <div class="panel-title">YouTube Vault</div>

        <div class="input-row">
          <input id="videoUrl" type="text" placeholder="Paste a YouTube link here" />
          <button id="saveBtn" class="neo-btn" type="button">Save Video</button>
        </div>

        <div id="status" class="status">Ready.</div>

        <div class="subsection">
          <div class="panel-title">Now Playing</div>
          <div id="playerArea" class="player-area">
            <div class="empty-state">No video selected.</div>
          </div>
        </div>

        <div class="subsection">
          <div class="panel-title">Saved Videos</div>
          <div id="videoList" class="list"></div>
        </div>
      </section>

      <section class="panel" id="calendar-panel">
        <div class="panel-title">Calendar</div>

        <div class="calendar-topbar">
          <button id="prevMonth" class="neo-btn" type="button">←</button>
          <div id="monthLabel" class="month-label">Month</div>
          <button id="nextMonth" class="neo-btn" type="button">→</button>
        </div>

        <div id="calendarGrid" class="calendar-grid"></div>

        <div class="calendar-form">
          <h3>Add Event</h3>
          <input id="eventTitle" type="text" placeholder="Event title" />
          <input id="eventDate" type="date" />
          <input id="eventTime" type="time" />
          <input id="reminderMinutes" type="number" min="0" value="10" placeholder="Reminder minutes before" />
          <button id="addEventBtn" class="neo-btn" type="button">Add Event</button>
        </div>

        <div class="subsection">
          <div class="panel-title">Saved Events</div>
          <div id="eventsList" class="list"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
