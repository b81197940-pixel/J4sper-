<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS Hub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanlines"></div>
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>

  <main class="shell">
    <header class="hero">
      <div class="hero-title">JARVIS HUB</div>
      <div class="hero-subtitle">Personal command interface</div>
      <div class="datetime">
        <span id="date">Loading date...</span>
        <span class="dot"></span>
        <span id="time">Loading time...</span>
      </div>
    </header>

    <section class="panel">
      <div class="panel-title">Shortcuts</div>
      <div class="button-row">
        <a class="neo-btn" href="https://www.youtube.com" target="_blank" rel="noopener">YouTube</a>
        <a class="neo-btn" href="https://open.spotify.com" target="_blank" rel="noopener">Spotify</a>
        <a class="neo-btn" href="https://calendar.google.com" target="_blank" rel="noopener">Calendar</a>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Save YouTube Link</div>
      <div class="input-row">
        <input id="videoUrl" type="text" placeholder="Paste a YouTube link here" />
        <button id="saveBtn" class="neo-btn">Save Video</button>
      </div>
      <div id="status" class="status">Ready.</div>
    </section>

    <section class="panel">
      <div class="panel-title">Now Playing</div>
      <div id="playerArea" class="player-area">
        <div class="empty-state">No video selected.</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Saved Videos</div>
      <div id="videoList" class="video-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
